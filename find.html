<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Find a Donor — LifeLine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#0a0a10;color:#e9eaf0;min-height:100vh}
:root{
  --red:#ff2d4d; --red-deep:#c81a36; --red-glow:rgba(255,45,77,.45);
  --bg:#0a0a10; --bg-2:#12121b; --bg-3:#1a1a26;
  --line:rgba(255,255,255,.08); --text:#e9eaf0; --muted:#9aa0b4;
  --green:#22c55e; --amber:#f59e0b; --blue:#3b82f6;
  --gradient:linear-gradient(135deg,#ff2d4d 0%,#ff6b6b 100%);
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:1rem}
::selection{background:var(--red);color:#fff}
.container{width:min(1200px,92%);margin-inline:auto}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:18px 0;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);background:rgba(10,10,16,.85);border-bottom:1px solid var(--line)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;gap:24px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.2rem;letter-spacing:-.02em}
.logo-mark{width:36px;height:36px;border-radius:10px;background:var(--gradient);display:grid;place-items:center;box-shadow:0 6px 20px var(--red-glow)}
.logo-mark svg{width:20px;height:20px;color:#fff}
.nav-links{display:flex;gap:32px;align-items:center}
.nav-links a{font-size:.92rem;color:#cdd0dc;transition:color .2s}
.nav-links a:hover{color:#fff}
.nav-cta{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:10px;padding:12px 22px;border-radius:100px;font-weight:600;font-size:.92rem;transition:all .25s ease;white-space:nowrap}
.btn-primary{background:var(--gradient);color:#fff;box-shadow:0 8px 30px var(--red-glow)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 40px var(--red-glow)}
.btn-ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);color:#fff}
.btn-ghost:hover{background:rgba(255,255,255,.12)}
.btn-sm{padding:9px 16px;font-size:.85rem}
@media (max-width:880px){.nav-links{display:none}}

/* PAGE */
.page{padding:110px 0 80px;background:radial-gradient(800px 500px at 80% 10%,rgba(255,45,77,.12),transparent 60%),var(--bg);min-height:100vh}
.page-head{margin-bottom:36px}
.crumb{font-size:.82rem;color:var(--muted);margin-bottom:14px}
.crumb a:hover{color:#fff}
.page-head h1{font-family:'Space Grotesk';font-size:clamp(1.8rem,3vw,2.4rem);font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-bottom:8px}
.page-head .lede{color:var(--muted);font-size:1.02rem}

/* SEARCH BAR */
.search-card{
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.01));
  border:1px solid var(--line);border-radius:18px;padding:8px;
  display:flex;gap:8px;margin-bottom:28px;box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.search-field{flex:1;display:flex;flex-direction:column;justify-content:center;padding:10px 16px;border-radius:12px;transition:background .2s}
.search-field:hover{background:rgba(255,255,255,.04)}
.search-field label{font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-bottom:4px}
.search-field input,.search-field select{background:transparent;border:none;color:#fff;font-size:.95rem;font-weight:600;padding:0;outline:none;width:100%}
.search-field select{cursor:pointer;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23ff2d4d' stroke-width='3' stroke-linecap='round'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right center;padding-right:18px}
.search-field select option{background:#1a1a26;color:#fff}
.search-btn{background:var(--gradient);color:#fff;font-weight:700;font-size:.95rem;padding:0 24px;border-radius:14px;display:flex;align-items:center;gap:8px;cursor:pointer;border:none;transition:all .2s}
.search-btn:hover{transform:translateY(-1px);box-shadow:0 10px 30px var(--red-glow)}
@media (max-width:600px){.search-card{flex-direction:column;padding:12px}.search-btn{padding:14px;justify-content:center}}

/* META */
.result-meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;margin-bottom:20px}
.result-meta .count{font-size:1.05rem;font-weight:700}
.result-meta .count .num{color:var(--red);font-family:'Space Grotesk'}
.result-meta .filters{display:flex;gap:8px;align-items:center}
.toggle{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted);cursor:pointer}
.toggle input{width:14px;height:14px;accent-color:var(--red);cursor:pointer}

/* COMPAT BANNER */
.compat-banner{background:linear-gradient(90deg,rgba(255,45,77,.12),rgba(255,45,77,.05));border:1px solid rgba(255,45,77,.3);border-radius:14px;padding:16px 20px;margin-bottom:24px;display:flex;align-items:center;gap:14px}
.compat-banner .ico{width:38px;height:38px;border-radius:10px;background:rgba(255,45,77,.18);display:grid;place-items:center;font-size:1.2rem;flex-shrink:0}
.compat-banner strong{color:#fff}
.compat-banner p{color:var(--muted);font-size:.9rem;margin-top:2px}

/* DONOR GRID */
.donors{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.donor-card{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));border:1px solid var(--line);border-radius:20px;padding:22px;transition:all .25s;position:relative;overflow:hidden}
.donor-card:hover{transform:translateY(-4px);border-color:rgba(255,45,77,.3)}
.donor-card::after{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--gradient);transform:scaleX(0);transform-origin:left;transition:transform .4s}
.donor-card:hover::after{transform:scaleX(1)}
.donor-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.donor-avatar{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#2a2a3a,#1a1a26);display:grid;place-items:center;font-weight:700;color:#fff;border:1px solid var(--line)}
.blood-badge{font-family:'Space Grotesk';font-weight:700;font-size:1.05rem;padding:6px 12px;border-radius:8px;background:rgba(255,45,77,.15);color:var(--red);border:1px solid rgba(255,45,77,.3)}
.donor-name{font-size:1.05rem;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.verified{display:inline-flex;align-items:center;gap:3px;color:#3b82f6;font-size:.72rem;font-weight:700}
.donor-meta{color:var(--muted);font-size:.86rem;margin-bottom:14px}
.donor-info{display:flex;gap:14px;font-size:.82rem;color:#cdd0dc;margin-bottom:14px;flex-wrap:wrap}
.donor-info span{display:flex;align-items:center;gap:6px}
.availability{display:flex;align-items:center;gap:8px;font-size:.82rem;margin-bottom:14px}
.dot{width:8px;height:8px;border-radius:50%}
.dot.on{background:var(--green);box-shadow:0 0 10px rgba(34,197,94,.6)}
.dot.off{background:#666}
.donor-actions{display:flex;gap:8px}
.donor-actions .btn{flex:1;padding:10px;font-size:.85rem;justify-content:center;border-radius:10px}

/* EMPTY */
.empty-state{padding:80px 20px;text-align:center;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));border:1px solid var(--line);border-radius:24px}
.empty-state .ico{width:64px;height:64px;border-radius:18px;background:rgba(255,45,77,.15);display:grid;place-items:center;margin:0 auto 20px;font-size:1.8rem}
.empty-state h3{font-family:'Space Grotesk';font-size:1.4rem;font-weight:700;margin-bottom:8px}
.empty-state p{color:var(--muted);max-width:480px;margin:0 auto 20px}

.loader{padding:60px;text-align:center;color:var(--muted)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.2);border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.compat-help{margin-top:24px;padding:18px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;font-size:.88rem;color:var(--muted);text-align:center}
.compat-help strong{color:#fff}
</style>
</head>
<body>

<nav class="nav">
  <div class="container nav-inner">
    <a href="index.html" class="logo">
      <span class="logo-mark"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8 8 4 12 4 16a8 8 0 1016 0c0-4-4-8-8-14z"/></svg></span>
      LifeLine
    </a>
    <div class="nav-links">
      <a href="find.html">Find Donor</a>
      <a href="index.html#donate">List as Donor</a>
      <a href="index.html#compatibility">Compatibility</a>
      <a href="index.html#faq">FAQ</a>
    </div>
    <div class="nav-cta">
      <a href="index.html#donate" class="btn btn-ghost btn-sm">List as Donor</a>
    </div>
  </div>
</nav>

<main class="page">
  <div class="container">
    <div class="page-head">
      <div class="crumb"><a href="index.html">← Back to home</a></div>
      <h1>Find a Donor</h1>
      <p class="lede">Search verified student donors by blood group and location. Reach out directly via WhatsApp or call.</p>
    </div>

    <form class="search-card" id="searchForm">
      <div class="search-field">
        <label>Blood Group</label>
        <select name="group">
          <option value="">Any group</option>
          <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
          <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
        </select>
      </div>
      <div class="search-field">
        <label>Location</label>
        <input name="location" type="text" placeholder="College or city e.g. Delhi" />
      </div>
      <button type="submit" class="search-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        Search
      </button>
    </form>

    <div class="result-meta">
      <div class="count" id="countMsg"><span class="num">—</span> donors found</div>
      <div class="filters">
        <label class="toggle"><input type="checkbox" id="onlyAvailable" checked> Available now only</label>
      </div>
    </div>

    <div id="compatBanner"></div>
    <div id="resultsArea"><div class="loader"><span class="spin"></span> Loading donors...</div></div>

    <div class="compat-help" id="compatHelp"></div>
  </div>
</main>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const sb = createClient('https://melqnfeslokxmlcgoqhw.supabase.co', 'sb_publishable_zxWxT9zSTrp8dXdALZYcBQ_mVCOkTtB');

const compat = {
  'A+':  ['A+','A-','O+','O-'],
  'A-':  ['A-','O-'],
  'B+':  ['B+','B-','O+','O-'],
  'B-':  ['B-','O-'],
  'AB+': ['A+','A-','B+','B-','AB+','AB-','O+','O-'],
  'AB-': ['A-','B-','AB-','O-'],
  'O+':  ['O+','O-'],
  'O-':  ['O-']
};

const params = new URLSearchParams(location.search);
const queryGroup = params.get('group') || '';
const queryLoc = (params.get('location') || '').trim();

const form = document.getElementById('searchForm');
form.querySelector('[name=group]').value = queryGroup;
form.querySelector('[name=location]').value = queryLoc;

let allDonors = [];

async function loadAndRender() {
  const { data, error } = await sb.from('donors').select('*').order('is_available', { ascending: false }).order('donations_count', { ascending: false });
  if (error) { document.getElementById('resultsArea').innerHTML = '<div class="empty-state"><h3>Could not load donors</h3><p>Network issue. Try refreshing.</p></div>'; return; }
  allDonors = data || [];
  render();
}

function render() {
  const onlyAvail = document.getElementById('onlyAvailable').checked;
  const banner = document.getElementById('compatBanner');
  const help = document.getElementById('compatHelp');
  const area = document.getElementById('resultsArea');
  banner.innerHTML = '';
  help.innerHTML = '';

  let exact = allDonors.filter(d => {
    if (onlyAvail && !d.is_available) return false;
    if (queryGroup && d.blood_group !== queryGroup) return false;
    if (queryLoc) {
      const blob = ((d.college || '') + ' ' + (d.city || '')).toLowerCase();
      if (!blob.includes(queryLoc.toLowerCase())) return false;
    }
    return true;
  });

  let list = exact;
  let usingCompat = false;

  // No exact matches — fall back to compatibility chart
  if (queryGroup && exact.length === 0) {
    const compatibleGroups = compat[queryGroup] || [queryGroup];
    list = allDonors.filter(d => {
      if (onlyAvail && !d.is_available) return false;
      if (!compatibleGroups.includes(d.blood_group)) return false;
      if (queryLoc) {
        const blob = ((d.college || '') + ' ' + (d.city || '')).toLowerCase();
        if (!blob.includes(queryLoc.toLowerCase())) return false;
      }
      return true;
    });
    if (list.length > 0) {
      usingCompat = true;
      banner.innerHTML = `
        <div class="compat-banner">
          <div class="ico">⚡</div>
          <div>
            <strong>No exact ${queryGroup} matches</strong>
            <p>Showing ${list.length} compatible donor${list.length === 1 ? '' : 's'} who can donate to ${queryGroup} based on the blood compatibility chart.</p>
          </div>
        </div>`;
    }
  }

  document.getElementById('countMsg').innerHTML = `<span class="num">${list.length}</span> ${usingCompat ? 'compatible' : ''} donor${list.length === 1 ? '' : 's'} found${queryGroup ? ` for <span class="num">${queryGroup}</span>` : ''}${queryLoc ? ` near <strong style="color:#fff">${escape(queryLoc)}</strong>` : ''}`;

  if (list.length === 0) {
    area.innerHTML = `
      <div class="empty-state">
        <div class="ico">🔎</div>
        <h3>No donors match this search</h3>
        <p>${queryGroup || queryLoc ? 'Try widening your filters — search a different group, broader location, or include unavailable donors.' : 'Pick a blood group and location to search.'}</p>
        <a class="btn btn-primary" href="index.html#donate">List as Donor Yourself</a>
      </div>`;
    return;
  }

  area.innerHTML = '<div class="donors">' + list.map(d => {
    const initials = (d.name || '').split(' ').map(x => x[0]).slice(0, 2).join('');
    const phoneClean = (d.phone || '').replace(/[^\d+]/g, '');
    const waText = encodeURIComponent(`Hi ${d.name}, I found you on LifeLine and urgently need ${queryGroup || 'blood'} donation. Could you help?`);
    return `
    <div class="donor-card">
      <div class="donor-top">
        <div class="donor-avatar">${escape(initials)}</div>
        <div class="blood-badge">${d.blood_group}</div>
      </div>
      <div class="donor-name">${escape(d.name)}${d.is_verified ? '<span class="verified">✓ Verified</span>' : ''}</div>
      <div class="donor-meta">${escape(d.college || d.city || 'Campus')}</div>
      <div class="donor-info">
        <span>❤ ${d.donations_count || 0} donations</span>
      </div>
      <div class="availability">
        <span class="dot ${d.is_available ? 'on' : 'off'}"></span>
        ${d.is_available ? 'Available now' : 'Currently unavailable'}
      </div>
      <div class="donor-actions">
        <a class="btn btn-primary" href="https://wa.me/${phoneClean}?text=${waText}" target="_blank" rel="noopener">WhatsApp</a>
        <a class="btn btn-ghost" href="tel:${phoneClean}">Call</a>
      </div>
    </div>`;
  }).join('') + '</div>';

  if (queryGroup) {
    const safe = compat[queryGroup] || [];
    help.innerHTML = `<strong>Blood compatibility:</strong> ${queryGroup} can safely receive from <strong style="color:#fff">${safe.join(', ')}</strong>.`;
  }
}

function escape(s) {
  return (s || '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('onlyAvailable').addEventListener('change', render);

loadAndRender();
</script>
</body>
</html>
